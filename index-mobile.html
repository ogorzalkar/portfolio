<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Karolina Ogorzalek | Graphic Designer</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/footer.css" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { background-color: #fff; }
    html body > .navbar, body > .navbar, .navbar {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100vw !important;
      min-width: 100vw !important;
      max-width: 100vw !important;
      z-index: 9999 !important;
      background: #fff !important;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05) !important;
      height: 64px !important;
      will-change: transform;
      transition: none !important;
    }
    body { padding-top: 64px !important; }
    body {
      padding-top: 64px !important;
    }
    .corner-image {
      width: 90vw !important;
      max-width: 340px !important;
      height: auto !important;
      display: block;
      margin: -40px auto 24px auto;
      border-radius: 18px;
    
      position: relative;
      z-index: 900;
    }
    @media (max-width: 600px) {
      .corner-image {
        margin-top: -48px;
        max-width: 96vw !important;
      }
    }
    #banner .container {
      padding: 0 4vw;
    }
    .text-content h1 {
      font-size: 2rem;
    }
    .cta {
      display: inline-block;
      margin: 24px 0 12px 0;
      padding: 12px 32px;
      font-size: 1.1rem;
      border-radius: 999px;
    }
    .status {
      margin-top: 32px;
      font-size: 1rem;
      text-align: center;
      justify-content: center;
      display: flex;
      align-items: center;
      
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo-area">
        <a href="index.html" style="display:flex;align-items:center;text-decoration:none;gap:8px;">
          <img src="assets/images/logo/logo.jpg" alt="Logo" class="logo-img" />
          <span class="logo-text">Portfolio</span>
        </a>
      </div>
      <div class="nav-links">
        <a href="projects.html">Projects</a>
        <a href="about-me.html">About me</a>
        <a href="contact.html">Contact</a>
      </div>
      <button class="nav-hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
        <span></span><span></span><span></span>
      </button>
      <div id="mobile-menu" class="mobile-nav-links">
        <a href="projects.html">Projects</a>
        <a href="about-me.html">About me</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>
  <img src="assets/images/me/ogorzalek.png" alt="Karolina Ogorzalek" class="corner-image" />
  <section id="banner">
    <div class="container">
      <div class="text-content">
        <p>Karolina Ogorzalek</p>
        <h1>Graphic Designer</h1>
        <p class="fade-text">
          <span class="fade-main">I believe that</span>&nbsp;
          <span class="keep">simplicity is powerful</span><span class="fade-main">, and truly <br />understanding the user's needs leads to <br />the best solutions.</span>
        </p>
        <a href="projects.html" class="cta">See my projects</a>
        <div class="status">
            <span class="status-dot"></span>
            <span class="status-text">I'm open to new job opportunities</span>
          </div>
      </div>
    </div>
  </section>
  <div data-footer></div>
  <script src="assets/js/footer-inline.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const hamburger = document.querySelector('.nav-hamburger');
      const mobileMenu = document.getElementById('mobile-menu');
      if (hamburger && mobileMenu) {
        hamburger.addEventListener('click', function() {
          const expanded = hamburger.getAttribute('aria-expanded') === 'true';
          hamburger.setAttribute('aria-expanded', !expanded);
          mobileMenu.classList.toggle('is-open');
          hamburger.classList.toggle('is-open');
        });
        // Zamknij menu po kliknięciu w link
        mobileMenu.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            mobileMenu.classList.remove('is-open');
            hamburger.classList.remove('is-open');
            hamburger.setAttribute('aria-expanded', 'false');
          });
        });
      }
    });
  </script>
</body>
</html>
