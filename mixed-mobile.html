  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.js-to-top').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
      // Hamburger menu
      const hamburger = document.querySelector('.nav-hamburger');
      const mobileMenu = document.getElementById('mobile-menu');
      if (hamburger && mobileMenu) {
        hamburger.addEventListener('click', function() {
          const expanded = hamburger.getAttribute('aria-expanded') === 'true';
          hamburger.setAttribute('aria-expanded', !expanded);
          mobileMenu.classList.toggle('is-open');
          hamburger.classList.toggle('is-open');
        });
        // Zamknij menu po kliknięciu w link
        mobileMenu.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            mobileMenu.classList.remove('is-open');
            hamburger.classList.remove('is-open');
            hamburger.setAttribute('aria-expanded', 'false');
          });
        });
      }
    });
  </script>
  <script>
    // Carousel logic for mobile
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.project-card.carousel').forEach(function(carousel) {
        const track = carousel.querySelector('.carousel-track');
        const slides = carousel.querySelectorAll('.carousel-slide');
        const prev = carousel.querySelector('.carousel-prev');
        const next = carousel.querySelector('.carousel-next');
        const dots = carousel.querySelectorAll('.carousel-dots button');
        let index = 0;
        function update(i) {
          index = (i + slides.length) % slides.length;
          const offset = carousel.clientWidth * index;
          track.style.transform = `translateX(-${offset}px)`;
          dots.forEach((d, j) => d.classList.toggle('is-active', j === index));
        }
        prev && prev.addEventListener('click', () => update(index - 1));
        next && next.addEventListener('click', () => update(index + 1));
        dots.forEach((d, i) => d.addEventListener('click', () => update(i)));
        window.addEventListener('resize', () => update(index));
        update(0);
      });
    });
  </script>
