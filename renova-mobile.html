  <script>
    // Karuzele mobilne (strzałki, swipe)
    document.addEventListener('DOMContentLoaded', function() {
      var carousels = document.querySelectorAll('.mobile-carousel');
      carousels.forEach(function(carousel) {
        var slides = carousel.querySelectorAll('.carousel-slide');
        var left = carousel.querySelector('.carousel-arrow.left');
        var right = carousel.querySelector('.carousel-arrow.right');
        var current = 0;
        slides.forEach((s, i) => s.classList.toggle('is-active', i === 0));
        function show(idx) {
          slides.forEach((s, i) => s.classList.toggle('is-active', i === idx));
          current = idx;
        }
        if (left) left.onclick = function(e) {
          e.preventDefault();
          var next = (current - 1 + slides.length) % slides.length;
          show(next);
        };
        if (right) right.onclick = function(e) {
          e.preventDefault();
          var next = (current + 1) % slides.length;
          show(next);
        };
        var track = carousel.querySelector('.carousel-track');
        var startX = null;
        if (track) {
          track.addEventListener('touchstart', function(e) {
            if (e.touches.length === 1) startX = e.touches[0].clientX;
          });
          track.addEventListener('touchend', function(e) {
            if (startX === null) return;
            var dx = e.changedTouches[0].clientX - startX;
            if (Math.abs(dx) > 30) {
              var next = (current + (dx < 0 ? 1 : -1) + slides.length) % slides.length;
              show(next);
            }
            startX = null;
          });
        }
      });
      // Otwieranie wideo w modalu (jak w GoVege mobile)
      document.querySelectorAll('.project-card.is-video').forEach(card => {
        card.style.cursor = 'pointer';
        card.addEventListener('click', function(e) {
          const video = card.querySelector('video');
          if (video && video.src) {
            e.preventDefault();
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('videoPlayer');
            player.src = video.src;
            modal.style.display = 'flex';
            player.play();
          }
        });
      });
      document.getElementById('videoModalClose').onclick = function() {
        const modal = document.getElementById('videoModal');
        const player = document.getElementById('videoPlayer');
        player.pause();
        player.src = '';
        modal.style.display = 'none';
      };
      document.getElementById('videoModal').addEventListener('click', function(e) {
        if (e.target === this) {
          const player = document.getElementById('videoPlayer');
          player.pause();
          player.src = '';
          this.style.display = 'none';
        }
      });
    });
    // Hamburger menu
    document.addEventListener('DOMContentLoaded', function() {
      const hamburger = document.querySelector('.nav-hamburger');
      const mobileMenu = document.getElementById('mobile-menu');
      if (hamburger && mobileMenu) {
        hamburger.addEventListener('click', function() {
          const expanded = hamburger.getAttribute('aria-expanded') === 'true';
          hamburger.setAttribute('aria-expanded', !expanded);
          mobileMenu.classList.toggle('is-open');
          hamburger.classList.toggle('is-open');
        });
        mobileMenu.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            mobileMenu.classList.remove('is-open');
            hamburger.classList.remove('is-open');
            hamburger.setAttribute('aria-expanded', 'false');
          });
        });
      }
    });
    // Smooth scroll
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.js-to-top').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    });
  </script>
